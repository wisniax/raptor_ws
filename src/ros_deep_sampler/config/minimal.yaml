controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    platform_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    drill_position_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    rotor_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    platform_velocity_controller:
      type: forward_command_controller/ForwardCommandController




platform_velocity_controller:
  ros__parameters:
    joints:
      - platform_joint
    interface_name: velocity


platform_controller:
  ros__parameters:
    joints:
      - platform_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

drill_position_controller:
  ros__parameters:
    joints:
      - drill_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

rotor_velocity_controller:
  ros__parameters:
    joints: 
      - rotor_joint
    interface_name: velocity
  