launch:
  - node_container:
      pkg: rclcpp_components
      exec: component_container
      name: mqtt_bridge_container
      namespace: "raptor"
      composable_node:
        - pkg: mqtt_bridge
          plugin: MqttBridge
          name: mqtt_bridge
          namespace: "raptor"
          param:
            - name: mqtt_enable_server_cert_auth
              value: true