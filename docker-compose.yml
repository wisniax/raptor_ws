services:
  ros-core:
    build:
      context: .
      dockerfile: ./.devcontainer/Dockerfile
      args:
        SSH_PORT: 2122
    image: wisniax/ros-core:nightly
    stdin_open: true
    container_name: ros-core
    hostname: ros-core
    tty: true
    pid: "host"
    ipc: "host"
    init: true
    network_mode: host
    environment:
      - TZ=Europe/Warsaw
      - ROS_ENABLE_AUTOSTART=1
      - ROS_BUILD_ON_STARTUP=on-failure
    volumes:
      - type: bind
        source: ./
        target: /mnt/local
        bind:
          create_host_path: false
      - type: bind
        source: ./.devcontainer/rex
        target: /etc/init.d/rex
        bind:
          create_host_path: false
      - type: bind
        source: ./.devcontainer/ca.crt
        target: /opt/share/raptor_ws_mqtt_certs/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${REX_CONTAINER_AUTHORIZED_KEYS:-/dev/null}"
        target: /run/secrets/authorized_keys
        read_only: true # Make sure this stays read-only!
        bind:
          create_host_path: false
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    network_mode: host
    volumes:
      - type: bind
        source: ./.devcontainer/mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
        bind:
          create_host_path: false
      - type: bind
        source: ./.devcontainer/mosquitto_passwd
        target: /mosquitto/mosquitto_passwd
        read_only: true
        bind:
          create_host_path: false
      - ./.mosquitto/data:/mosquitto/data:Z
      - ./.mosquitto/log:/mosquitto/log:Z
      - type: bind
        source: ./.devcontainer/mqtt-server-certs
        target: /mosquitto/certs
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-p", "8883", "-t", "$$SYS/#", "--cafile", "/mosquitto/certs/ca.crt", "-u", "${MQTT_USERNAME:-raptors}", "-P", "${MQTT_PASSWORD:-changeme}", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
